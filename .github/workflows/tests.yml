name: Python quality checks

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy matplotlib scikit-learn pytest streamlit
      - name: Compile application and source
        run: python -m compileall -q app src tests
      - name: Run unit, integration and dashboard page tests
        run: python -m pytest -q
      - name: Smoke-test Streamlit startup
        shell: bash
        run: |
          status=0
          timeout 25s streamlit run app/dashboard.py --server.headless true --server.port 8501 > streamlit.log 2>&1 || status=$?
          cat streamlit.log
          if [ "$status" -ne 124 ]; then
            echo "Streamlit exited before the smoke-test timeout (status=$status)"
            exit 1
          fi
          if grep -q "Traceback" streamlit.log; then
            echo "Streamlit reported a Python exception during startup"
            exit 1
          fi
