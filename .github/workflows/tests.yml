name: IPL Intelligence quality checks

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ipl-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r api/requirements.txt pandas numpy matplotlib scikit-learn pytest streamlit
      - name: Compile application and source
        run: python -m compileall -q app api src tests
      - name: Run Python tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build Next.js frontend
        run: npm run build
