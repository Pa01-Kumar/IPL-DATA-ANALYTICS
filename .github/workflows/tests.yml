name: Python quality checks

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ipl-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy matplotlib scikit-learn pytest streamlit
      - name: Compile application and source
        run: python -m compileall -q app src tests
      - name: Run unit, integration and dashboard page tests
        run: python -m pytest -q
